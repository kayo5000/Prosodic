# mypy config — Phase 2b (docs/BUILD_PLAN.md).
#
# This is a dynamically-typed Flask codebase with ~zero prior type
# annotations. Running --strict here on day one would produce thousands of
# lines of noise that bury the real signal, not surface it — so this starts
# permissive (no --strict, no --disallow-untyped-defs) and tightens later as
# annotations get added, rather than pretending a strict baseline exists that
# doesn't. Per Khris's instruction: fix what's cheap, flag/log what's more
# involved — this config is calibrated to make that split visible, not to
# suppress it via blanket ignores.
#
# Scope: domain/, application/, infrastructure/ (the Clean Architecture
# layers from Phase 1) plus api.py and veil_revival_routes.py (the route
# layer they're called from). Root-level engine/support modules
# (thesaurus_engine.py, learning_engine.py, etc.) and cantos/behavior/
# analysis packages are included too — see [mypy] files below for the
# exact list; anything not listed (tests/, one-off scripts, mobile/) is
# intentionally out of scope for this pass.

[mypy]
python_version = 3.11
warn_return_any = False
warn_unused_configs = True
ignore_missing_imports = True
check_untyped_defs = True
disallow_untyped_defs = False
follow_imports = silent
exclude = (?x)(
    ^mobile/
    | ^cantos_data/
    | ^tests/
    | ^\.venv/
    | ^venv/
  )
